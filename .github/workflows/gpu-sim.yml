name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so this builds
# the unit tests and runs the ones that can run on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behavior or timing, so it complements real-GPU testing and
# does not replace it.

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/**"
      - "Makefile"
      - "arch.mk"
      - "VERSION"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (CUDA 13.0, simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      - name: Clone cuarena
        run: git clone --depth 1 https://github.com/muhos/cuArena.git "$HOME/cuarena"

      # The simulator runs PTX only, so the device code is built for
      # compute_90. The root Makefile hands GPU_ARCH to CMake for cuarena, and
      # CMake does not accept "compute_90", so cuarena is configured here with
      # 90-virtual and the Makefile's architecture stamp is written by hand so
      # that it keeps this build.
      - name: Build cuarena
        run: |
          cmake -B "$HOME/cuarena/build" -S "$HOME/cuarena" \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CUDA_COMPILER=/usr/local/cuda-13.0/bin/nvcc \
                -DCMAKE_CUDA_ARCHITECTURES=90-virtual \
                -DCUARENA_BUILD_EXAMPLES=OFF \
                -DCUARENA_BUILD_TESTS=OFF
          cmake --build "$HOME/cuarena/build" --target cuArena -j3
          echo compute_90 > "$HOME/cuarena/build/.quasarq-arch"

      # tests/Makefile defaults to -arch=native (needs a GPU at build time)
      # and links -lnvidia-ml. NVML is not linked by the tests' sources: src/power.cuh
      # loads libnvidia-ml.so.1 with dlopen and falls back when it is absent,
      # so the link flag is dropped. The simulator also needs a shared CUDA
      # runtime, hence -cudart shared in the nvcc command.
      - name: Build tests
        env:
          CUDA_PATH: /usr/local/cuda-13.0
        run: |
          export CUARENA_DIR="$HOME/cuarena"
          sed -i 's/-arch=native/-arch=compute_90/; s/ -lnvidia-ml//' tests/Makefile
          make -C tests -j3 assert=1 GPU_ARCH=compute_90 \
               NVCC="/usr/local/cuda-13.0/bin/nvcc -ccbin g++ -cudart shared" \
               test_parser test_scheduler test_equivalence

      # test_simulator and test_sampling are not run: they simulate surface
      # codes up to d100 and a q50000 circuit, which is far too slow for a
      # functional simulator, and on the simulated H100 they stop in
      # all_random_measures with an out-of-bounds shared memory read.
      - name: Run tests
        working-directory: tests
        run: |
          for t in test_parser test_scheduler test_equivalence; do
            echo "::group::$t"
            vgpu run ./$t
            echo "::endgroup::"
          done
