[build-system]
requires = ["setuptools>=77", "nanobind>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quasarq"
dynamic = ["version"]
description = "GPU stabilizer sampling"
readme = "src/binding/README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Osama Mahmoud", email = "muh.osama25@gmail.com" }]
keywords = ["quantum", "stabilizer", "clifford", "stim", "cuda", "gpu"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Environment :: GPU :: NVIDIA CUDA",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy"]

[project.optional-dependencies]
sinter = ["sinter", "pymatching", "stim"]

[project.urls]
Homepage = "https://github.com/muhos/QuaSARQ"

[tool.setuptools]
zip-safe = false
include-package-data = false

# The VERSION file at the repository root is the single source of the version number; the
# Makefile reads the same file to define the VERSION macro for the core.
[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src/binding"]
include = ["quasarq"]

[tool.setuptools.package-data]
quasarq = ["*.so", "kernel.config", "py.typed", "*.pyi"]
